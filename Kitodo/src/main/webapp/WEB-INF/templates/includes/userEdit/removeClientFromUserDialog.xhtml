<ui:composition
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="http://xmlns.jcp.org/jsf/html"
        xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
        xmlns:p="http://primefaces.org/ui">
    <p:dialog class="remove-client-dialog"
              id="removeClientDialog"
              widgetVar="removeClientDialog"
              showHeader="false"
              modal="true"
              width="500px"
              appendTo="@(body)"
              resizable="false"
              closable="false">
        <h3>#{msgs.removeClientProjectsFromUser}</h3>
        <h:form id="removeFromProjectsForm">
            <div class="select-note ui-messages-info">#{UserEditViewClientsTab.getRemoveClientProjectsMessage()}</div>
            <div class="select-selector">
                <p>
                    <p:dataTable styleClass="client-projects"
                                 value="#{UserEditViewClientsTab.clientProjects}"
                                 var="project">
                        <p:column id="projectTitle">
                            <h:outputText value="#{project}"
                                          title="#{project}"/>
                        </p:column>
                    </p:dataTable>
                </p>
                <p:panelGrid columns="1">
                    <p:column>
                        <p:commandButton id="confirm"
                                         actionListener="#{UserEditViewClientsTab.removeUserFromClientProjects()}"
                                         action="#{UserEditViewClientsTab.deleteFromClient()}"
                                         onstart="PF('removeClientDialog').hide(); $('#loadingScreen').show();"
                                         oncomplete="$('#loadingScreen').hide();"
                                         update="@all"
                                         styleClass="primary right"
                                         value="#{msgs.confirm}"
                                         icon="fa fa-check"
                                         iconPos="right"/>
                        <p:commandButton id="cancelButton"
                                         action="#{UserEditViewClientsTab.cancelRemoveClient()}"
                                         process="@this"
                                         update="@none"
                                         oncomplete="PF('removeClientDialog').hide();"
                                         value="#{msgs.cancel}"
                                         styleClass="secondary right"
                                         icon="fa fa-close"
                                         iconPos="right"/>
                    </p:column>
                </p:panelGrid>
            </div>
        </h:form>
    </p:dialog>
</ui:composition>
