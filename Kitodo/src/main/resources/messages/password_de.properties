HISTORY_VIOLATION=Passwort entspricht einem der vorherigen %1$s Passwörter.
ILLEGAL_WORD=Passwort enthält das Wörterbuchwort '%1$s'.
ILLEGAL_WORD_REVERSED=Passwort enthält das umgekehrte Wörterbuchwort '%1$s'.
ILLEGAL_MATCH=Passwort stimmt mit dem unzulässigen Muster '%1$s' überein.
ALLOWED_MATCH=Passwort muss dem Muster '%1$s' entsprechen.
ILLEGAL_CHAR=Passwort enthält das unzulässige Zeichen '%1$s'.
ALLOWED_CHAR=Passwort enthält das unzulässige Zeichen '%1$s'.
ILLEGAL_SEQUENCE=Passwort enthält die ungültige Sequenz '%1$s'.
ILLEGAL_USERNAME=Passwort enthält die Benutzer-ID '%1$s'.
ILLEGAL_USERNAME_REVERSED=Passwort enthält die umgekehrte Benutzer-ID '%1$s'.
ILLEGAL_WHITESPACE=Passwort darf keine Leerzeichen enthalten.
INSUFFICIENT_UPPERCASE=Passwort muss mindestens %1$s Großbuchstaben enthalten.
INSUFFICIENT_LOWERCASE=Passwort muss mindestens %1$s Kleinbuchstaben enthalten.
INSUFFICIENT_ALPHABETICAL=Passwort muss mindestens %1$s alphabetische Zeichen enthalten.
INSUFFICIENT_DIGIT=Passwort muss mindestens %1$s Ziffern enthalten.
INSUFFICIENT_SPECIAL=Passwort muss mindestens %1$s Sonderzeichen enthalten.
INSUFFICIENT_CHARACTERISTICS=Passwort entspricht %1$s von %3$s Zeichenregeln, aber %2$s sind erforderlich.
SOURCE_VIOLATION=Passwort darf nicht mit Ihrem %1$s Passwort identisch sein.
TOO_LONG=Passwort darf nicht länger als %2$s Zeichen lang sein.
TOO_SHORT=Passwort muss mindestens %1$s Zeichen lang sein.
