granularity.info.textbox.weeks=Jeder Vorgang bildet eine einzelne Woche des Erscheinungsverlaufes der Zeitung ab, der alle in dieser Woche tatsächlich erschienenen Ausgaben der Zeitung enthält. Eine Woche beginnt mit Montag. Wenn Neujahr nicht auf einen Montag fällt, werden zwei Vorgänge für die beiden Wochenteile in den jeweiligen Kalenderjahren erzeugt. Da im DFG-Viewer aus der kalendarischen Tagesauswahl derzeit (Stand: 2014) lediglich auf Vorgangsebene verlinkt werden kann, hat dies zur Folge, dass unabhängig vom gewählten Tag immer auf das erste Image der Woche gesprungen wird, in vielen Fällen also auf den falschen Tag. Beachten Sie ausserdem, dass Wochengrenzen regelmässig nicht mit Monatsgrenzen übereinstimmen.
